[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "natasha-agent"
version = "0.9.0"
description = "Natasha Agent - persistent, multimodal, local-first personal AI agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Natasha Contributors" }]
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "websockets>=12"]
crypto = ["cryptography>=42"]
docs = ["pypdf>=4", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=0.6", "pillow>=10"]
desktop = []
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]
all = ["natasha-agent[api,crypto,docs,postgres,dev]"]

[project.scripts]
natasha = "natasha.cli.main:main"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
natasha = ["db/migrations/*.sql", "config/*.toml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
  "security: security + governance release gates",
  "integration: subsystems wired together",
  "e2e: end-to-end runtime tests",
  "slow: slower integration checks",
  "network: requires outbound network",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
