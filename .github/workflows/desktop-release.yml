name: Windows Desktop Release Pipeline

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'frontend/**'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pre-flight-checks:
    name: Verification and Security Gates
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install uv and Dependencies
        run: |
          uv sync --all-extras

      - name: Run Backend & Desktop Integration Tests
        run: |
          uv run --with pytest --with pytest-asyncio pytest tests/unit/test_frontend_syntax.py tests/unit/test_frontend_stitch_integration.py tests/unit/test_desktop_integration.py

      - name: Run Secret and Security Leak Detection
        run: |
          powershell -Command "if (Select-String -Path 'src-tauri/**/*.rs', 'frontend/**/*.js' -Pattern 'sk-[a-zA-Z0-9]{20,}' -Quiet) { exit 1 }"
          powershell -Command "if (Select-String -Path 'src-tauri/**/*.rs', 'src-tauri/capabilities/*.json' -Pattern 'PRIVATE KEY' -Quiet) { exit 1 }"

  build-windows:
    name: Build Windows x86_64 Desktop
    needs: pre-flight-checks
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: |
          npm install

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Verify Tauri Config and Rust Compilation
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Windows Desktop Installers (NSIS & MSI)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
           WINDOWS_SIGNING_CERTIFICATE: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGNING_CERTIFICATE || '' }}
           WINDOWS_SIGNING_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGNING_PASSWORD || '' }}
           WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
        run: |
           ./scripts/windows/build-and-verify-release.ps1

      - name: Stage Verified Windows Release Artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE 'release-artifacts'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item 'src-tauri/target/release/natasha.exe' $stage
          Copy-Item 'src-tauri/target/release/bundle/nsis/Natasha_0.9.1_x64-setup.exe' $stage
          Copy-Item 'src-tauri/target/release/bundle/msi/Natasha_0.9.1_x64_en-US.msi' $stage

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natasha-windows-${{ github.ref_name }}
          path: release-artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: natasha-windows-${{ github.ref_name }}
          path: release-bundles

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-bundles/**/*
          generate_release_notes: true
          draft: true
          prerelease: false

      - name: Download Actual GitHub Release Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --dir release-downloads

      - name: Verify Downloaded Release Signatures and Installed Executable
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
        run: |
          ./scripts/windows/build-and-verify-release.ps1 -VerifyOnly -ArtifactsDirectory release-downloads

      - name: Publish Verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --draft=false
