name: Desktop Release Pipeline

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'frontend/**'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-flight-checks:
    name: Verification and Security Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv and Dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --all-extras

      - name: Run Backend & Desktop Integration Tests
        run: |
          uv run --with pytest --with pytest-asyncio pytest tests/unit/test_frontend_syntax.py tests/unit/test_frontend_stitch_integration.py tests/unit/test_desktop_integration.py

      - name: Run Secret and Security Leak Detection
        run: |
          # Ensure no hardcoded API keys or private credentials are in tracked code
          ! grep -rn "sk-" src-tauri/ frontend/ || exit 1
          ! grep -rn "PRIVATE KEY" src-tauri/capabilities/ src-tauri/src/ || exit 1

  build-desktop:
    name: Build Desktop (${{ matrix.platform.name }})
    needs: pre-flight-checks
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle-ext: .exe, .msi
          - name: macOS (Universal)
            os: macos-latest
            target: universal-apple-darwin
            bundle-ext: .dmg, .app
          - name: Linux (x86_64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle-ext: .AppImage, .deb

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux Build Dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Verify Tauri Config and Rust Compilation
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Desktop Package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx --yes @tauri-apps/cli build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natasha-desktop-${{ matrix.platform.os }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-bundles

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-bundles/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
